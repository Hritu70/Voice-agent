<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aria - Sales Voice Agent</title>
<style>body{font-family:system-ui,sans-serif;max-width:800px;margin:30px auto;padding:0 16px;background:#f6f7fb;color:#222}main{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 24px #0001}button{padding:12px 18px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:600;cursor:pointer;margin:4px}button.secondary{background:#555}#chat{height:360px;overflow:auto;border:1px solid #ddd;padding:12px;border-radius:12px;margin:14px 0}.user{color:#165bd6}.agent{color:#12804a}input{padding:12px;width:min(70%,450px);border:1px solid #ddd;border-radius:10px}small{color:#555}</style></head>
<body><main><h1>Aria · NimbusDesk Sales Agent</h1><p>Text chat with browser speech input and speech output. Speech features depend on browser support.</p>
<div><button id="start">🎙 Start listening</button><button id="stop" class="secondary">Stop</button><button id="end" class="secondary">End call & summarize</button><button id="slots" class="secondary">Show demo slots</button></div>
<div id="chat" aria-live="polite"></div><form id="form"><input id="message" placeholder="Type your message…" autocomplete="off"><button>Send</button></form><pre id="summary"></pre><small>Voice recognition works best in Chromium browsers. No audio is uploaded by this page except text recognized by the browser and sent to this app.</small></main>
<script>
const sid='web-'+(crypto.randomUUID?crypto.randomUUID():Date.now()); const chat=document.querySelector('#chat'); const input=document.querySelector('#message'); const synth=window.speechSynthesis;
function add(who,text){const p=document.createElement('p');p.className=who;p.textContent=(who==='user'?'You: ':'Aria: ')+text;chat.appendChild(p);chat.scrollTop=chat.scrollHeight;}
function speak(text){if(!synth||!text)return; synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';synth.speak(u);}
function errText(d,fallback){if(!d)return fallback;if(typeof d.detail==='string')return d.detail;if(Array.isArray(d.detail))return d.detail.map(x=>x.msg).join('; ');return fallback;}
async function send(text){text=(text||'').trim();if(!text)return;add('user',text);input.value='';try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:text})});const data=await r.json().catch(()=>null);if(!r.ok||!data){add('agent',errText(data,'Server error ('+r.status+'). Please retry.'));return;}const reply=data.reply||'(no reply)';add('agent',reply);speak(reply);}catch(e){add('agent','Network/server error. Please retry.');}}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();send(input.value)});
let recognition;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang='en-IN';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>send(e.results[0][0].transcript);recognition.onerror=e=>add('agent','Speech recognition error: '+e.error);recognition.onend=()=>document.querySelector('#start').textContent='🎙 Start listening';}else document.querySelector('#start').disabled=true;
document.querySelector('#start').onclick=()=>{if(!recognition){alert('SpeechRecognition is not supported in this browser. Try Chrome.');return;}try{recognition.start();document.querySelector('#start').textContent='Listening…';}catch(e){/* already listening */}};document.querySelector('#stop').onclick=()=>{if(recognition)recognition.stop();if(synth)synth.cancel();};
document.querySelector('#slots').onclick=async()=>{let d;try{const r=await fetch('/slots');d=await r.json();if(!r.ok)throw new Error();}catch(e){add('agent','Could not load demo slots. Please retry.');return;}const picks=(d.available||[]).slice(0,8);if(!picks.length){add('agent','No demo slots are available right now.');return;}add('agent','Available demo slots are shown below. Click a slot to book it.');picks.forEach(x=>{const b=document.createElement('button');b.className='secondary';b.textContent=x.slot_id+' — '+x.slot_date+' '+x.slot_time;b.onclick=async()=>{const name=prompt('Customer name (optional):');if(name===null)return;try{const res=await fetch('/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,slot_id:x.slot_id,customer_name:name})});const result=await res.json().catch(()=>null);add('agent',res.ok&&result?'Demo booked: '+result.appointment.slot_date+' at '+result.appointment.slot_time:errText(result,'Booking failed'));b.disabled=true;}catch(e){add('agent','Network error while booking. Please retry.');}};chat.appendChild(b);});chat.scrollTop=chat.scrollHeight;};
document.querySelector('#end').onclick=async()=>{if(synth)synth.cancel();if(recognition)recognition.stop();const out=document.querySelector('#summary');out.textContent='Summarizing…';try{const r=await fetch('/end-call/'+encodeURIComponent(sid),{method:'POST'});const d=await r.json().catch(()=>null);out.textContent=r.ok&&d?JSON.stringify(d,null,2):errText(d,'Summary failed ('+r.status+').');}catch(e){out.textContent='Network error while summarizing.';}};
</script></body></html>
