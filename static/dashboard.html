<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sales Agent Dashboard</title><style>body{font-family:system-ui,sans-serif;background:#f5f6fa;color:#202124;max-width:1150px;margin:28px auto;padding:0 15px}h1{margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card,section{background:#fff;padding:16px;border-radius:14px;box-shadow:0 3px 15px #0000000a;margin:12px 0}.metric{font-size:28px;font-weight:700}table{border-collapse:collapse;width:100%;overflow:auto}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee;vertical-align:top}small{color:#555}</style></head><body><h1>NimbusDesk · Sales Dashboard</h1><small>Refresh to see latest leads, calls, and appointments.</small><div id="metrics" class="grid"></div><section><h2>Leads</h2><div id="leads"></div></section><section><h2>Appointments</h2><div id="appointments"></div></section><section><h2>Call summaries</h2><div id="calls"></div></section><script>
function table(container,rows,keys){const root=document.querySelector(container);root.replaceChildren();if(!rows.length){root.textContent='No data yet.';return;}const t=document.createElement('table'),head=document.createElement('tr');keys.forEach(k=>{const th=document.createElement('th');th.textContent=k;head.appendChild(th)});t.appendChild(head);rows.forEach(row=>{const tr=document.createElement('tr');keys.forEach(k=>{const td=document.createElement('td');const v=row[k];td.textContent=Array.isArray(v)?v.join('\n'):(v??'');td.style.whiteSpace='pre-line';tr.appendChild(td)});t.appendChild(tr)});root.appendChild(t)}
fetch('/dashboard').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(d=>{document.querySelector('#metrics').innerHTML='';[['Leads',d.leads.length],['Appointments',d.appointments.length],['Calls summarized',d.calls.length],['Open demo slots',d.available_slots.length]].forEach(([label,value])=>{const card=document.createElement('div');card.className='card';card.innerHTML='<small>'+label+'</small><div class="metric">'+value+'</div>';document.querySelector('#metrics').appendChild(card)});table('#leads',d.leads,['name','need','budget','timeline','authority','company_size','score','sentiment','status']);table('#appointments',d.appointments,['customer_name','slot_date','slot_time','appointment_type','session_id']);table('#calls',d.calls,['summary','action_items','final_lead_score','sentiment','created_at']);}).catch(e=>{document.body.append('Dashboard API error: '+e)});
</script></body></html>
